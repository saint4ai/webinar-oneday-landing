<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<title>Админка воркшопа</title>
<style nonce="__NONCE__">
:root{
  --bg:#F6F0E4;--card:#FFFFFF;--fg:#2A211C;--hint:#6E5F53;--line:rgba(160,83,42,.20);
  --gold:#C9A05A;--gold-hi:#E3C07B;--gold-soft:rgba(201,160,90,.20);--on-gold:#2A211C;
  --link:#8B5E3C;--good:#2F7D4F;--bad:#B3402A;--warn-bg:rgba(179,64,42,.10);
  --radius:16px;
}
:root[data-theme=dark]{
  --bg:#15110D;--card:#211B15;--fg:#F3EBDD;--hint:#A99B8A;--line:rgba(227,192,123,.20);
  --gold:#E3C07B;--gold-hi:#F2DCA0;--gold-soft:rgba(227,192,123,.16);--on-gold:#241B0E;
  --link:#E3C07B;--good:#6CCB8E;--bad:#F2927B;--warn-bg:rgba(242,146,123,.14);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-width:320px;background:var(--bg);color:var(--fg);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;overflow-x:hidden;padding-bottom:env(safe-area-inset-bottom)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.logo-svg{display:block;height:100%;width:auto;color:var(--fg)}

/* вход */
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:28px 20px;max-width:420px;margin:0 auto}
.login .logo{height:40px;margin-bottom:10px}
.login h1{margin:0;font-size:24px;line-height:1.2}
.login p{margin:0;color:var(--hint)}
.pinform{display:grid;gap:12px;margin-top:2px}
.dots{display:flex;justify-content:center;align-items:center;gap:12px;height:24px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--hint);background:transparent;transition:background-color .12s,border-color .12s}
.dots i.on{background:var(--gold);border-color:var(--gold)}
.dots.shake{animation:shake .3s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.keypad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.key{height:60px;min-width:0;padding:0;display:grid;place-items:center;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:27px;font-weight:600;line-height:1;touch-action:manipulation;-webkit-user-select:none;user-select:none;transition:background-color .08s,transform .08s}
.key:active{background:var(--gold-soft);transform:scale(.96)}
.key.fn{font-size:15px;color:var(--hint)}
.key svg{width:28px;height:28px;stroke:var(--fg);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn{height:50px;border:0;border-radius:14px;padding:0 20px;background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:var(--on-gold);font-weight:700;font-size:16px}
.btn:disabled{opacity:.55}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--fg);font-weight:600}
.btn.small{height:40px;font-size:14px;padding:0 14px}
.btn.full{width:100%}
.login .err{min-height:22px;margin:0;color:var(--bad);font-weight:600;text-align:center}
.note{padding:12px 14px;border-radius:12px;background:var(--gold-soft);color:var(--fg)}
.note.warn{background:var(--warn-bg)}

/* шапка */
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px 6px}
.head .logo{height:22px}
.head-r{display:flex;align-items:center;gap:6px;color:var(--hint);font-size:13px}
.icon{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;padding:0}
.icon svg{width:20px;height:20px;stroke:var(--fg);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* период */
.bar{padding:4px 14px 8px}
.chips{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:0 14px 2px}
.chips::-webkit-scrollbar,.tabs::-webkit-scrollbar{display:none}
.chip{flex:1 1 auto;white-space:nowrap;height:38px;padding:0 6px;border-radius:19px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:14px}
.chip[aria-pressed=true]{background:linear-gradient(180deg,var(--gold-hi),var(--gold));border-color:transparent;color:var(--on-gold)}
.dates{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px;margin-top:8px}
.dates input{height:40px;min-width:0;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 8px;font-size:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:8px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.seg button{height:38px;border:0;background:transparent;font-size:14px;font-weight:600}
.seg button[aria-pressed=true]{background:var(--gold-soft);box-shadow:inset 0 -2px 0 var(--gold)}
.plabel{margin-top:8px;color:var(--hint);font-size:13px}

/* вкладки */
.tabs{position:sticky;top:0;z-index:5;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;background:var(--bg);border-bottom:1px solid var(--line);padding:0 8px}
.tab{flex:none;height:44px;padding:0 12px;border:0;background:transparent;color:var(--hint);font-weight:600;font-size:14px;border-bottom:3px solid transparent}
.tab[aria-selected=true]{color:var(--fg);border-bottom-color:var(--gold)}

main{padding:12px 14px 40px;display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;min-width:0}
h2{margin:0 0 10px;font-size:17px;line-height:1.25}
.hint{color:var(--hint);font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.stat .l{color:var(--hint);font-size:13px;line-height:1.25}
.stat .v{font-size:28px;font-weight:800;line-height:1.1;margin-top:2px;letter-spacing:-.01em}
.stat .s{font-size:12px;color:var(--hint);margin-top:2px}
.stat .d{font-size:13px;font-weight:700;margin-top:4px;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.d.good{color:var(--good)}.d.bad{color:var(--bad)}.d.eq{color:var(--hint)}
.d small{font-weight:500;color:var(--hint)}

/* график и таблицы */
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--hint);font-size:10px}
.chart .val{fill:var(--fg);font-size:10px;font-weight:700}
.chart .bar{fill:var(--gold)}
.chart .bar2{fill:var(--fg)}
.legend .k3{width:12px;height:12px;border-radius:3px;background:var(--fg)}
.chart .ln{fill:none;stroke:var(--fg);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .dot{fill:var(--card);stroke:var(--fg);stroke-width:2}
.legend{display:flex;gap:16px;margin-top:6px;font-size:13px;color:var(--hint)}
.legend i{display:inline-block;vertical-align:-1px;margin-right:6px}
.legend .k1{width:12px;height:12px;border-radius:3px;background:var(--gold)}
.legend .k2{width:12px;height:12px;border-radius:50%;border:2px solid var(--fg)}
.tw{overflow-x:auto;margin:10px -14px 0;padding:0 14px;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;padding-left:0}
th:last-child,td:last-child{padding-right:0}
th{color:var(--hint);font-weight:600;font-size:12px;vertical-align:bottom}
tfoot td{font-weight:800;border-bottom:0}
td.wrap{white-space:normal;overflow-wrap:anywhere;min-width:130px;text-align:left}
tr.click{cursor:pointer}
tr.click:active td{background:var(--gold-soft)}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:8px;background:var(--gold-soft);margin-left:6px;white-space:nowrap}
.badge.ok{background:rgba(47,125,79,.16);color:var(--good)}
.badge.no{background:var(--warn-bg);color:var(--bad)}
.badge.mute{background:transparent;border:1px solid var(--line);color:var(--hint)}

/* списки */
.tools{display:grid;gap:8px}
.tools-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.search{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 14px;min-width:0;width:100%}
.sel{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 10px;max-width:100%}
.sel.full{width:100%}
.tag{display:inline-flex;align-items:center;gap:8px;max-width:100%;padding:6px 8px 6px 12px;border-radius:14px;background:var(--gold-soft);font-size:13px;font-weight:600}
.tag span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag button{flex:none;width:26px;height:26px;border-radius:13px;border:0;background:var(--card);font-weight:800}
.list{display:grid;gap:8px}
.row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.row .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline;color:var(--hint);font-size:13px}
.row .nm{font-weight:700;font-size:16px;margin-top:2px;overflow-wrap:anywhere}
.row .ph{display:inline-flex;align-items:center;gap:8px;margin-top:2px;min-height:36px;padding:0 10px 0 0;border:0;background:transparent;font-size:16px;font-weight:600;color:var(--link)}
.row .contacts{display:flex;flex-wrap:wrap;align-items:center;column-gap:14px}
.row .tgn{margin-top:2px;font-size:16px;font-weight:600;color:var(--fg);overflow-wrap:anywhere;min-width:0}
.row .ph svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.row .meta{color:var(--hint);font-size:13px;overflow-wrap:anywhere;margin-top:2px}
.row .flags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.row .flags .badge{margin:0}
.empty{padding:28px 10px;text-align:center;color:var(--hint)}
.more{width:100%}
.msgs{display:grid;gap:4px;margin-top:8px;font-size:13px}
.msgs div{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-top:1px solid var(--line)}
.msgs b{font-weight:600;overflow-wrap:anywhere}
.msgs span{flex:none;white-space:nowrap}
.msgs div.col{flex-direction:column;gap:2px}
.msgs div.col span{flex:initial;white-space:normal;color:var(--hint);overflow-wrap:anywhere}
.kv{display:grid;gap:6px;font-size:14px}
.kv div{display:flex;justify-content:space-between;gap:12px}
.kv span:first-child{color:var(--hint)}
.kv b{text-align:right}
.skel{height:84px;border-radius:14px;background:linear-gradient(90deg,var(--card),var(--gold-soft),var(--card));background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
/* WhatsApp: пульт сообществ */
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn.bad{background:var(--bad);color:#fff}
.btn.small[disabled]{opacity:.55}
.confirm{margin-top:12px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--warn-bg)}
.confirm p{margin:0 0 10px}
.confirm .actions{margin-top:0}
.modebody{margin-top:12px;display:grid;gap:10px}
.swrow{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.swrow .hint{margin-top:2px}
.sw{flex:none;width:52px;height:30px;padding:0;border-radius:15px;border:1px solid var(--line);background:var(--card);position:relative}
.sw i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--hint);transition:transform .15s,background-color .15s}
.sw[aria-checked=true]{background:var(--gold-soft);border-color:var(--gold)}
.sw[aria-checked=true] i{transform:translateX(22px);background:var(--gold)}
.sw[disabled]{opacity:.55}
.field{display:grid;gap:4px;min-width:0;font-size:13px;color:var(--hint)}
.inp{height:44px;width:100%;min-width:0;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:0 10px}
.inp[disabled]{opacity:.6}
.chips2{display:flex;gap:6px;flex-wrap:wrap}
.chips2 .chip{flex:0 1 auto;padding:0 12px}
.qrbox{display:grid;place-items:center;min-height:200px;padding:14px;border-radius:14px;border:1px solid var(--line);background:#fff}
.qrbox img{display:block;width:min(100%,260px);height:auto;aspect-ratio:1;image-rendering:pixelated}
.qrwait{color:#6E5F53;text-align:center}
.steps{margin:12px 0 8px;padding-left:20px;display:grid;gap:4px}
.linkrow{display:flex;gap:8px;align-items:center;margin-top:8px}
.linkrow code{flex:1 1 auto;min-width:0;overflow-wrap:anywhere;font-size:13px;color:var(--link)}
.linkrow .btn{flex:none}
.tpl{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.kv span.badge{margin-left:0}
.kv b{overflow-wrap:anywhere}
.msgs b.bad{color:var(--bad)}
details.ser summary{display:flex;gap:10px;align-items:baseline;min-height:36px;cursor:pointer;list-style:none}
details.ser summary::-webkit-details-marker{display:none}
details.ser .tm{flex:none;font-weight:800;font-variant-numeric:tabular-nums}
details.ser .tp{min-width:0;overflow-wrap:anywhere}
.serbody{margin-top:8px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}
.card > .note{margin-top:10px}
/* WhatsApp: дожим WABA */
.dzmap{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:center;margin-top:8px}
.dzmap .vn{font-weight:800;font-variant-numeric:tabular-nums}
.dzmap .sel{width:100%}
.dzmap .inp{grid-column:2}
.dzset{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.dzrec .top{align-items:center}
/* WhatsApp: блок «Статус» и подключение по номеру */
.wst{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:14px;border:1px solid var(--gold);background:var(--gold-soft)}
.wst .dot{flex:none;width:14px;height:14px;margin-top:5px;border-radius:50%;background:var(--gold)}
.wst > div{min-width:0}
.wst-t{font-size:20px;font-weight:800;line-height:1.2;overflow-wrap:anywhere}
.wst-d{margin-top:4px;font-size:14px;line-height:1.4;color:var(--hint);overflow-wrap:anywhere}
.wst.ok{border-color:var(--good);background:rgba(47,125,79,.12)}
.wst.ok .dot{background:var(--good)}
.wst.bad{border-color:var(--bad);background:var(--warn-bg)}
.wst.bad .dot{background:var(--bad)}
.wst.bad .wst-t{color:var(--bad)}
.card .wkv{margin-top:12px}
.pairbox{margin-top:12px;padding:14px 10px;border-radius:14px;border:1px solid var(--gold);background:var(--gold-soft);text-align:center}
.paircode{font-size:clamp(26px,9vw,36px);font-weight:800;letter-spacing:.1em;line-height:1.1;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;user-select:all}
.pairbox .hint{margin-top:6px}
.howto{margin-top:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);font-size:14px;line-height:1.45;overflow-wrap:anywhere}
.row > .kv{margin-top:8px}
/* Общий рубильник «Автоматизация» */
.autobar{margin:2px 14px 8px;padding:12px 14px;border-radius:var(--radius);border:1px solid var(--good);background:rgba(47,125,79,.10)}
.autobar.off{border-color:var(--bad);background:var(--warn-bg)}
.autobar .ab-row{display:flex;gap:12px;align-items:center;justify-content:space-between}
.autobar .ab-t{font-size:19px;font-weight:800;line-height:1.2}
.autobar.off .ab-t{color:var(--bad)}
.autobar .ab-d{margin-top:3px;font-size:13px;line-height:1.35;color:var(--hint);overflow-wrap:anywhere}
.autobar .sw{width:64px;height:36px;border-radius:18px}
.autobar .sw i{top:4px;left:4px;width:26px;height:26px}
.autobar .sw[aria-checked=true]{background:rgba(47,125,79,.20);border-color:var(--good)}
.autobar .sw[aria-checked=true] i{transform:translateX(28px);background:var(--good)}
.autobar .confirm{background:var(--card)}
.autobar .field{margin:0 0 10px}
/* План прямого эфира одной лентой */
.plan{margin-top:12px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--gold-soft)}
.plan .pt{font-weight:700;margin-bottom:6px}
.ribbon{margin:0;padding:0;list-style:none;display:block;line-height:1.6;overflow-wrap:anywhere}
.ribbon li{display:inline}
.ribbon li + li::before{content:" · ";color:var(--hint);font-weight:700}
.ribbon li.done{color:var(--hint)}
.ribbon li.now{font-weight:800;box-shadow:inset 0 -2px 0 var(--gold)}
.plan.hold{border-color:var(--bad);background:var(--warn-bg)}
.plan .hold-t{display:inline-block;margin-bottom:8px;font-weight:800;color:var(--bad)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:calc(100vw - 32px);padding:10px 16px;border-radius:12px;background:var(--fg);color:var(--bg);font-size:14px;font-weight:600;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.25)}
@media (max-height:700px){.login{padding:14px 20px;gap:8px}.login .logo{height:30px;margin-bottom:0}.login h1{font-size:22px}.pinform{gap:8px}.keypad{gap:8px}}
@media (prefers-reduced-motion:reduce){.skel,.icon.spin svg,.dots.shake{animation:none}.key,.dots i{transition:none}.key:active{transform:none}}
</style>
</head>
<body>

<svg width="0" height="0" class="sr" aria-hidden="true" focusable="false">
  <defs><linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E3C07B"/><stop offset="1" stop-color="#C9A05A"/></linearGradient></defs>
  <g id="logo" fill="none">

    <path d="M1689.08 534.091H1559.75L1523.91 468.126H1306.28L1270.44 534.091H1141.11L1349.39 149.73H1480.8L1689.08 534.091ZM1415.36 267.116L1353.03 381.385H1477.16L1415.36 267.116ZM1828.6 534.091H1700.3V149.73H1828.6V534.091Z" fill="currentColor"/>
  </g>
</svg>

<!-- Вход -->
<section id="login" class="login" hidden>
  <svg class="logo" viewBox="170 140 1670 404" role="img" aria-label="onAI Academy"><use href="#logo"/></svg>
  <h1>Админка воркшопа</h1>
  <p id="login-sub">Только для владельца. Введите пароль.</p>
  <form id="login-form" class="pinform" autocomplete="off">
    <label class="sr" for="pin">Пароль</label>
    <input id="pin" class="sr" type="password" inputmode="none" autocomplete="off" maxlength="8" tabindex="-1">
    <div id="dots" class="dots" role="img" aria-label="Пароль: введено 0 цифр"></div>
    <div class="keypad" role="group" aria-label="Цифровая клавиатура">
      <button type="button" class="key" data-key="1">1</button>

      h('div', null, h('b', { text: 'Ежедневное создание сообществ' }), h('div', { class: 'hint', text: d.enabled ? 'Включено: каждый день в 20:20 создаётся сообщество под эфир следующего дня, ссылка на сайте переключается в 20:40.' : 'Выключено: новые сообщества не создаются. Созданные работают до конца.' })),
      h('button', { class: 'sw', type: 'button', role: 'switch', 'aria-checked': String(d.enabled), 'aria-label': 'Ежедневное создание сообществ', disabled: !!wa.busy, onclick: function () {
        if (d.enabled) waAct('daily', { enabled: false }, 'Выключаю…'); else ask('daily-on')();
      } }, h('i'))));
    if (wa.conf === 'daily-on') box.appendChild(confirmBox('Включить ежедневное создание? Сообщество под ближайший эфир создастся ' + (d.next ? d.next.text : 'в 20:20') + ', дальше каждый день.', 'Включить', function () { waAct('daily', { enabled: true, confirm: true }, 'Включаю…'); }));
    if (d.enabled && d.next) box.appendChild(h('div', { class: 'hint', text: 'Ближайшее создание: эфир ' + d.next.dayLabel + ', ' + d.next.text + '.' }));
    box.appendChild(h('div', { class: 'actions' }, btn('Создать сообщество следующего эфира сейчас', ask('dailycreate'), 'ghost')));
    if (wa.conf === 'dailycreate') box.appendChild(confirmBox('Создать сообщество ближайшего эфира прямо сейчас, не дожидаясь 20:00?', 'Создать', function () { waAct('daily/create', { confirm: true }, 'Создаю сообщество, это займёт около минуты…'); }));
    return box;
  }
  function addDaysStr(day, n) {
    var p = day.split('-').map(Number), t = new Date(Date.UTC(p[0], p[1] - 1, p[2] + n));
    return t.getUTCFullYear() + '-' + ('0' + (t.getUTCMonth() + 1)).slice(-2) + '-' + ('0' + t.getUTCDate()).slice(-2);
  }
  function waEventBody(s) {
    var ev = s.event, f = wa.form || { date: '', start: '20:00', recruit: '' }, box = h('div', { class: 'modebody' });
    var tone = ev.status === 'unset' || ev.status === 'done' ? '' : ev.status === 'creating' ? ' warn' : '';
    box.appendChild(h('div', { class: 'note' + tone, text: ev.statusText }));
    var locked = ev.locked || !!wa.busy;
    function field(label, type, key, extra) {
      var inp = h('input', Object.assign({ class: 'inp', type: type, value: f[key], 'aria-label': label, disabled: locked, oninput: function () { f[key] = inp.value; wa.dirty = true; } }, extra || {}));
      return h('label', { class: 'field' }, h('span', { text: label }), inp);
    }
    box.appendChild(h('div', { class: 'grid2' }, field('Дата эфира', 'date', 'date', { min: s.today }), field('Старт, время Алматы', 'time', 'start')));
    box.appendChild(field('Начало набора (создам сообщество в ' + ev.createTime + ')', 'date', 'recruit', { min: '2000-01-01' }));
    if (!locked) {
      var q = h('div', { class: 'chips2', role: 'group', 'aria-label': 'Быстро выбрать начало набора' });
      [3, 2, 1].forEach(function (n) {
        q.appendChild(h('button', { class: 'chip', type: 'button', text: 'За ' + n + (n === 1 ? ' день' : ' дня'), onclick: function () {
          if (!f.date) { toast('Сначала выбери дату эфира'); return; }
          f.recruit = addDaysStr(f.date, -n); wa.dirty = true; waDraw();
        } }));
      });
      box.appendChild(q);
    }
    if (ev.locked) box.appendChild(h('div', { class: 'hint', text: 'Сообщество уже создано, даты и время закреплены. Чтобы задать другой эфир, нажми «Сбросить»: созданное сообщество останется.' }));
    box.appendChild(h('div', { class: 'actions' },
      btn('Сохранить', function () {
        if (!f.date || !f.recruit || !f.start) { waNotice('Заполни дату эфира, время старта и начало набора.', true); waDraw(); return; }
        waAct('event', { date: f.date, start: f.start, recruitFrom: f.recruit }, 'Сохраняю…', function () { wa.dirty = false; });
      }, '', ev.locked),
      btn('Создать сообщество сейчас', ask('evcreate'), 'ghost', !ev.date),
      btn(ev.launched ? 'Рассылки запущены' : 'Запустить рассылки сейчас', ask('evlaunch'), 'ghost', !ev.canLaunch),
      btn('Сбросить', ask('evreset'), 'ghost', !ev.date && !ev.done)));
    if (ev.launched) box.appendChild(h('div', { class: 'hint', text: 'Рассылки запущены досрочно (' + ev.launchedText + '): в сообщество каждый день идёт только прогрев, ссылка на эфир и оффер придут в день эфира.' }));
    else if (ev.date && !ev.canLaunch && ev.hasCommunity) box.appendChild(h('div', { class: 'hint', text: 'По умолчанию рассылки ждут дня эфира и запускаются сами. Досрочный запуск доступен до наступления дня эфира.' }));
    if (wa.conf === 'evcreate') box.appendChild(confirmBox('Создать сообщество эфира ' + (ev.dateLabel || '') + ' прямо сейчас? Ссылка на сайте сразу станет вести в него.', 'Создать', function () { waAct('event/create', { confirm: true }, 'Создаю сообщество, это займёт около минуты…'); }));
    if (wa.conf === 'evlaunch') box.appendChild(confirmBox('Запустить рассылки досрочно? По плану они ждут дня эфира (' + (ev.dateLabel || '') + '). После запуска серия пойдёт в сообщество каждый день по расписанию, с ближайшего сообщения до дня эфира. В дни до эфира уходят только прогревающие сообщения, без ссылки на эфир и оффера: они придут в день эфира. Тексты прогрева написаны под день эфира («сегодня в ' + (ev.start || '20:00') + '»), в другие дни они будут неточными. Telegram по-прежнему шлёт серию только в день эфира. Остановить можно переключателем «Автоматизация» вверху или кнопкой «Сбросить».', 'Да, запустить', function () { waAct('event/launch', { confirm: true }, 'Запускаю рассылки…'); }));
    if (wa.conf === 'evreset') box.appendChild(confirmBox('Сбросить настройки эфира? Созданное сообщество останется и продолжит работать, но ссылка на сайте станет постоянной, а Telegram вернётся к ежедневной серии.', 'Сбросить', function () { waAct('event/reset', { confirm: true }, 'Сбрасываю…', function () { wa.dirty = false; wa.form = null; }); }, true));
    if (ev.plan) box.appendChild(waPlanBox(ev.plan));
    return box;
  }
  // План прямого эфира одной лентой: считается сервером из настроек и серии. Рубильник выключен или модуль на паузе: сверху красная строка.
  function waPlanBox(plan) {
    var box = h('div', { class: 'plan' + (plan.paused ? ' hold' : ''), role: 'group', 'aria-label': 'План прямого эфира' });
    if (plan.paused) box.appendChild(h('div', { class: 'hold-t', text: plan.pausedText }));
    if (plan.paused && plan.pausedWhy) box.appendChild(h('div', { class: 'hint', text: plan.pausedWhy }));
    box.appendChild(h('div', { class: 'pt', text: 'План' }));
    box.appendChild(h('ol', { class: 'ribbon' }, plan.items.map(function (i) { return h('li', { class: i.state, text: i.text }); })));
    box.appendChild(h('div', { class: 'hint', text: plan.telegram }));
    return box;
  }

  // ── ссылка на сайте, сообщества ──
  function waLinkCard(s) {
    var l = s.link;
    var card = h('div', { class: 'card' }, h('h2', { text: 'Ссылка на сайте' }), h('div', { class: 'kv' },
      h('div', null, h('span', { text: 'Сейчас ведёт' }), h('span', { class: 'badge ' + (l.url ? 'ok' : 'mute'), text: l.kind === 'event' ? 'в прямой эфир' : l.kind === 'daily' ? 'в сообщество набора' : 'на постоянную' }))));
    card.appendChild(h('div', { class: 'hint', text: l.text }));
    // Постоянная ссылка для кнопки шаблона WABA: сама ведёт туда же, куда сайт.
    card.appendChild(h('div', { class: 'tpl' },
      h('div', { class: 'hint', text: 'Для кнопки шаблона WABA. Постоянная, переадресует в сообщество текущего набора. Переходов сегодня: ' + l.templateClicksToday + '.' }),
      h('div', { class: 'linkrow' }, h('code', { text: l.templateUrl }), h('button', { class: 'btn small ghost', type: 'button', text: 'Копировать', onclick: function () { copyText(l.templateUrl, 'Ссылка скопирована'); } }))));
    return card;
  }
  function communityRow(c) {
    var top = h('div', { class: 'top' }, h('span', { text: 'эфир ' + c.dayLabel }), h('span', null, c.onSite ? h('span', { class: 'badge ok', text: 'ссылка на сайте' }) : null, h('span', { class: 'badge ' + (c.ready ? 'ok' : 'no'), text: c.ready ? 'готово' : 'достраивается' })));
    var row = h('div', { class: 'row' }, top, h('div', { class: 'nm', text: c.name }),
      h('div', { class: 'kv' },
        kv('Участников', c.members === null ? 'не проверяли' : c.members + (c.membersAgo ? ' (' + c.membersAgo + ')' : '')),
        kv('Вступили сегодня', String(c.joinedToday)),
        kv('Вступили всего', String(c.joinedTotal))));
    if (c.link) row.appendChild(h('div', { class: 'linkrow' }, h('code', { text: c.link }), h('button', { class: 'btn small ghost', type: 'button', text: 'Копировать', onclick: function () { copyText(c.link, 'Ссылка скопирована'); } })));
    return row;
  }
  function waCommunityCards(s) {
    var out = [];
    [s.current, s.next].forEach(function (g) {
      if (!g) return;
      var card = h('div', { class: 'card' }, h('h2', { text: g.title + ' ' + g.dayLabel }));
      // Вступили N из M записавшихся на этот день: участники сообщества против заявок (замер идёт, когда включён дожим WABA).
      if (g.signups) {
        var x = g.signups;
        card.appendChild(h('div', { class: 'hint', text: x.joined === null
          ? 'Записавшихся на этот день: ' + x.applied + '. Кто из них вступил, пока не замеряно: замер идёт, когда включён дожим WABA.'
          : 'Вступили ' + x.joined + ' из ' + x.applied + ' записавшихся на этот день' + (x.measured ? ' (замер ' + x.measured + ')' : '') + (x.unresolved ? '. Участников без номера в замере: ' + x.unresolved + ', их сопоставить с заявками нельзя' : '') + '.' }));
      }
      if (g.cards.length) g.cards.forEach(function (c) { card.appendChild(communityRow(c)); });
      else card.appendChild(h('div', { class: 'hint', text: g.pending || 'Сообщества пока нет.' }));
      out.push(card);
    });
    return out;
  }

  // ── сообщение серии ──
  function waSendCard(s) {
    var nm = s.nextMessage;
    var card = h('div', { class: 'card' }, h('h2', { text: 'Сообщения серии' }));
    card.appendChild(h('div', { class: 'kv' }, kv('Ближайшее', nm ? nm.at + ' · ' + nm.topic : 'нет'), nm ? kv('Когда', 'эфир ' + nm.dayLabel + ', ' + nm.inText) : null));
    var sel = h('select', { class: 'sel full', 'aria-label': 'Сообщение серии', disabled: !!wa.busy });
    s.series.forEach(function (m) { if (m.enabled) sel.appendChild(h('option', { value: m.id, text: m.at + ' · ' + m.topic })); });
    if (wa.sendId) sel.value = wa.sendId;
    sel.addEventListener('change', function () { wa.sendId = sel.value; });
    var target = s.sendTo.length ? s.sendTo.join(', ') : '';
    card.appendChild(h('div', { class: 'tools' }, sel,
      btn('Отправить сейчас', function () { wa.sendId = sel.value; ask('send')(); }, '', !s.sendTo.length)));
    if (!s.sendTo.length) card.appendChild(h('div', { class: 'hint', text: 'Сейчас нет готового сообщества, куда можно отправить.' }));
    if (wa.conf === 'send') {
      var m = s.series.filter(function (x) { return x.id === (wa.sendId || (s.series[0] && s.series[0].id)); })[0];
      card.appendChild(confirmBox('Отправить «' + (m ? m.topic : '') + '» в ' + target + ' прямо сейчас? Это увидят все участники.', 'Отправить', function () { waAct('send', { id: m ? m.id : '', confirm: true }, 'Отправляю…'); }));
    }
    return card;
  }

  // ── группы и сообщества номера ──
  function waGroupsLoad(force) {
    if (wa.busy) return;
    wa.groupsMsg = 'Загружаю список…'; waDraw();
    api('wa/groups', force ? new URLSearchParams({ refresh: '1' }) : null).then(function (r) {
      wa.groups = r.items; wa.groupsMsg = r.cached && force ? 'Список обновляли меньше 20 секунд назад, показываю его.' : '';
    }).catch(function (err) {
      if (err instanceof HttpError && (err.status === 401 || err.status === 403)) { waStop(); fail(err); return; }
      if (err instanceof HttpError && err.body && err.body.items && err.body.items.length) wa.groups = err.body.items;
      wa.groupsMsg = err instanceof HttpError && err.body && err.body.message ? err.body.message : 'Нет связи с сервером.';
    }).then(function () { waDraw(); });
  }
  function waGroupsCard() {
    var card = h('div', { class: 'card' }, h('h2', { text: 'Группы и сообщества номера' }),
      h('div', { class: 'hint', text: 'Что уже есть у подключённого номера. Показываем для справки, рассылки по ним не идут.' }),
      h('div', { class: 'actions' }, btn(wa.groups ? 'Обновить список' : 'Показать список', function () { waGroupsLoad(!!wa.groups); }, 'ghost')));
    if (wa.groupsMsg) card.appendChild(h('div', { class: 'note', text: wa.groupsMsg }));
    if (wa.groups) {
      if (!wa.groups.length) card.appendChild(h('div', { class: 'empty', text: 'У номера пока нет групп и сообществ.' }));
      else {
        var list = h('div', { class: 'list' });
        wa.groups.forEach(function (g) {
          list.appendChild(h('div', { class: 'row' },
            h('div', { class: 'top' }, h('span', { text: g.typeLabel }), h('span', null, g.ours ? h('span', { class: 'badge ok', text: 'создано здесь' }) : null)),
            h('div', { class: 'nm', text: g.name }),
            h('div', { class: 'flags' },
              h('span', { class: 'badge mute', text: g.size === null ? 'размер неизвестен' : g.size + ' ' + plural(g.size, 'участник', 'участника', 'участников') }),
              h('span', { class: 'badge ' + (g.role === 'owner' || g.role === 'admin' ? 'ok' : 'mute'), text: 'номер: ' + g.roleLabel }),
              g.announceOnly ? h('span', { class: 'badge mute', text: 'пишут только админы' }) : null)));
        });
        card.appendChild(list);
      }
    }
    return card;
  }

  // ── журнал и серия ──
  function waJournalCard(s) {
    var card = h('div', { class: 'card' }, h('h2', { text: 'Последние события' }));
    if (!s.journal.length) { card.appendChild(h('div', { class: 'empty', text: 'Событий пока нет.' })); return card; }
    card.appendChild(h('div', { class: 'msgs jr' }, s.journal.map(function (j) {
      return h('div', { class: 'col' }, h('b', { class: j.kind === 'error' ? 'bad' : '', text: j.text }), h('span', { text: j.t }));
    })));
    return card;
  }
  function waSeriesCard(s) {
    var card = h('div', { class: 'card' }, h('h2', { text: 'Серия сообщений' }), h('div', { class: 'hint', text: 'Только просмотр. Время по Алматы, ' + (s.mode === 'event' && s.event.start !== s.event.startDefault ? 'сдвинуто под старт ' + s.event.start + '.' : 'под старт эфира в ' + s.event.startDefault + '.') }));
    var list = h('div', { class: 'list' });
    s.series.forEach(function (m) {
      list.appendChild(h('details', { class: 'row ser' },
        h('summary', null, h('span', { class: 'tm', text: m.at }), h('span', { class: 'tp', text: m.topic }), m.enabled ? null : h('span', { class: 'badge mute', text: 'выключено' })),
        h('div', { class: 'flags' }, m.media ? h('span', { class: 'badge mute', text: m.media === 'video' ? 'видео' : 'картинка' }) : null, m.poll ? h('span', { class: 'badge mute', text: 'опрос: ' + m.poll }) : null, h('span', { class: 'badge mute', text: m.id })),
        h('div', { class: 'serbody', text: m.text })));
    });
    card.appendChild(list);
    return card;
  }

  // ───────── старт ─────────
  if (!initData) {
    showLogin('Откройте приложение из Telegram: кнопка «Админка» в чате с ботом или команда /app.', true);
    $('login-sub').textContent = 'Откройте админку в Telegram на телефоне или компьютере.';
  } else if (token) showApp();
  else showLogin('', false);
})();
</script>
</body>
</html>
