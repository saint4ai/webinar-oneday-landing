<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<title>Превью комнаты эфира Bizon 365</title>
<link rel="stylesheet" href="base.css">
<style>
html,body{width:1920px;height:1080px}
.room{position:relative;width:1920px;height:1080px;overflow:hidden;background:#14100E url(../../workshop-montazh/assets/tg/bizon-bg-1920x1080.jpg) 0 0/1920px 1080px no-repeat}
.player{position:absolute;left:190px;top:208px;width:1180px;height:664px;display:block;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.chat{position:absolute;left:1370px;top:208px;width:360px;height:664px;background:#171210;border-left:1px solid rgba(227,192,123,.14);padding:22px 20px;display:flex;flex-direction:column;gap:16px}
.chat .hd{height:12px;width:120px;border-radius:6px;background:rgba(251,243,228,.28);margin-bottom:8px}
.chat .m{display:flex;gap:10px;align-items:flex-start}
.chat .m i{flex:none;width:28px;height:28px;border-radius:50%;background:rgba(227,192,123,.22)}
.chat .m b{display:block;height:10px;border-radius:5px;background:rgba(251,243,228,.22)}
.chat .m b+b{margin-top:7px;background:rgba(251,243,228,.12)}
.chat .in{margin-top:auto;height:44px;border-radius:10px;background:rgba(251,243,228,.07);border:1px solid rgba(227,192,123,.14)}
</style></head>
<body><div class="room">
  <img class="player" src="../../workshop-montazh/assets/tg/cover-bizon.jpg" alt="">
  <div class="chat">
    <div class="hd"></div>
    <div class="m"><i></i><div style="flex:1"><b style="width:46%"></b><b style="width:92%"></b></div></div>
    <div class="m"><i></i><div style="flex:1"><b style="width:38%"></b><b style="width:70%"></b></div></div>
    <div class="m"><i></i><div style="flex:1"><b style="width:52%"></b><b style="width:88%"></b></div></div>
    <div class="m"><i></i><div style="flex:1"><b style="width:34%"></b><b style="width:60%"></b></div></div>
    <div class="m"><i></i><div style="flex:1"><b style="width:44%"></b><b style="width:96%"></b></div></div>
    <div class="m"><i></i><div style="flex:1"><b style="width:40%"></b><b style="width:66%"></b></div></div>
    <div class="in"></div>
  </div>
</div></body></html>
