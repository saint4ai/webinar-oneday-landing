<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<title>Аватарка бота 640x640</title>
<link rel="stylesheet" href="base.css">
<style>
html,body{width:640px;height:640px}
.a{position:relative;width:640px;height:640px;overflow:hidden;
  background:
    radial-gradient(520px 520px at 50% 44%,rgba(227,192,123,.20),transparent 70%),
    radial-gradient(640px 520px at 50% 118%,rgba(160,83,42,.34),transparent 70%),
    linear-gradient(170deg,#2a211b 0%,#18120f 100%)}
/* фото 560x560 увеличиваем мягко (около 1.18x), лицо по центру кадра */
.a img{position:absolute;width:660px;height:660px;left:0px;top:18px;mix-blend-mode:lighten;
  filter:contrast(1.04) saturate(1.04)}
</style></head>
<body><div class="a"><img src="../../workshop-montazh/assets/img/ava-studio.jpg" alt=""></div></body></html>
