<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<title>Карточка серии 1080x1350</title>
<link rel="stylesheet" href="base.css">
<style>
html,body{width:1080px;height:1350px}
.card{position:relative;width:1080px;height:1350px;overflow:hidden;
  --gx:80%;--gy:16%;
  background:
    radial-gradient(900px 720px at var(--gx) var(--gy),rgba(227,192,123,.30),rgba(227,192,123,.08) 55%,transparent 75%),
    radial-gradient(820px 700px at 6% 104%,rgba(160,83,42,.30),transparent 70%),
    radial-gradient(1000px 800px at 0% 0%,#2b221c 0%,transparent 65%),
    linear-gradient(165deg,#211A16 0%,#14100E 72%)}
.frame{position:absolute;inset:26px;border-radius:36px;border:1px solid rgba(227,192,123,.17);pointer-events:none}
/* метка сверху: кегль 42 px (с 09.10.2026, раньше 27: в превью чата не читалась) */
.label{position:absolute;left:80px;top:68px;display:flex;align-items:center;gap:20px;font-weight:800;font-size:42px;line-height:1;letter-spacing:.07em;color:var(--gold);white-space:nowrap}
.label i{display:block;flex:none;width:52px;height:3px;background:currentColor}
.logo{position:absolute;left:80px;bottom:68px;height:52px;width:auto}
.h{position:absolute;left:80px;top:150px;width:920px;font-family:'Unbounded',sans-serif;font-weight:700;color:var(--cream);letter-spacing:-.015em;line-height:1.1}
.h em{font-style:normal;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.glass{border-radius:34px}
.shadow-floor{position:absolute;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.62),rgba(0,0,0,.3) 55%,transparent);filter:blur(5px)}
.light-floor{position:absolute;border-radius:50%;background:radial-gradient(closest-side,rgba(227,192,123,.35),transparent)}
.obj{position:absolute;display:block;filter:drop-shadow(0 12px 16px rgba(0,0,0,.45))}
.big{position:absolute;font-family:'Unbounded',sans-serif;font-weight:700;line-height:1;letter-spacing:-.04em;white-space:nowrap;padding:.14em .04em .02em;margin:-.14em -.04em -.02em;
  background:linear-gradient(180deg,#F0D49A 0%,#E3C07B 42%,rgba(160,83,42,.78) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 18px 34px rgba(0,0,0,.35))}

/* светлый вариант: кремовый фон, тёмный текст, золото как акцент (чередуем с тёмными, чтобы в ленте чата карточки не сливались) */
.card.light{
  background:
    radial-gradient(900px 720px at var(--gx) var(--gy),rgba(227,192,123,.62),rgba(227,192,123,.18) 55%,transparent 76%),
    radial-gradient(860px 700px at 4% 104%,rgba(201,160,90,.34),transparent 70%),
    linear-gradient(165deg,#FBF3E4 0%,#F1E2C4 100%)}
.light .frame{border-color:rgba(42,33,28,.16)}
.light .grain{opacity:.045}
.light .label{color:#8F5E1E}
.light .h{color:#2A211C}
.light .h em,.light .big{background:linear-gradient(180deg,#C99236 0%,#A8741F 55%,#7E4F17 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.light .big{filter:drop-shadow(0 14px 22px rgba(120,80,30,.22))}
.light .glass{background:linear-gradient(145deg,rgba(255,255,255,.86),rgba(255,248,232,.58));border-color:rgba(160,83,42,.38);
  box-shadow:0 24px 54px rgba(120,80,30,.22),inset 0 1px 0 #fff}
.light .shadow-floor{background:radial-gradient(closest-side,rgba(70,40,15,.6),rgba(70,40,15,.28) 55%,transparent)}
.light .light-floor{background:radial-gradient(closest-side,rgba(227,192,123,.55),transparent)}
.light .obj{filter:drop-shadow(0 12px 16px rgba(70,40,15,.38))}
.light .logo{content:url("../../workshop-montazh/assets/logos/onai-logo-brown.svg")}

/* warm-edits: окно CapCut, нарисованное векторно по смыслу, красный крест поверх и пузырь чата «правил словами» */
.edits .win{position:absolute;left:110px;top:372px;width:860px;height:600px;border-radius:32px;overflow:hidden;transform:rotate(-3deg);
  background:#121214;border:2px solid rgba(255,255,255,.14);box-shadow:0 46px 80px rgba(0,0,0,.62),0 0 0 1px rgba(0,0,0,.5)}
.edits .win::after{content:"";position:absolute;left:0;right:0;top:72px;bottom:0;background:rgba(20,16,14,.3);pointer-events:none}
.edits .win .bar{position:absolute;left:0;top:0;right:0;height:72px;display:flex;align-items:center;gap:18px;padding:0 26px;background:#1b1b20;border-bottom:2px solid rgba(255,255,255,.07)}
.edits .win .bar img{display:block;width:46px;height:46px;border-radius:12px;flex:none}
.edits .win .bar .nm{font-weight:800;font-size:34px;line-height:1;letter-spacing:.01em;color:#fff}
.edits .win .bar .sp{flex:1}
.edits .win .bar .ex{width:132px;height:42px;border-radius:12px;background:#FBF3E4}
.edits .win .bar .wd{display:flex;gap:10px;margin-left:8px}
.edits .win .bar .wd i{display:block;width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.28)}
.edits .win .pn{position:absolute;top:72px;height:318px;background:#19191d}
.edits .win .media{left:0;width:236px;border-right:2px solid rgba(0,0,0,.5)}
.edits .win .media .tabs{position:absolute;left:16px;top:16px;display:flex;gap:12px}
.edits .win .media .tabs i{display:block;width:34px;height:30px;border-radius:9px;background:rgba(255,255,255,.14)}
.edits .win .media .tabs i:first-child{background:#E3C07B}
.edits .win .media .grid{position:absolute;left:16px;right:16px;top:62px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.edits .win .th{display:block;position:relative;height:74px;border-radius:10px;overflow:hidden}
.edits .win .th::after{content:"";position:absolute;right:6px;bottom:6px;width:28px;height:11px;border-radius:5px;background:rgba(0,0,0,.55)}
.edits .win .th .hd{position:absolute;left:50%;bottom:26px;width:26px;height:26px;margin-left:-13px;border-radius:50%;background:rgba(251,243,228,.6)}
.edits .win .th .sh{position:absolute;left:50%;bottom:-20px;width:64px;height:50px;margin-left:-32px;border-radius:50% 50% 0 0;background:rgba(251,243,228,.42)}
.edits .win .th .sun{position:absolute;right:14px;top:12px;width:20px;height:20px;border-radius:50%;background:rgba(251,243,228,.7)}
.edits .win .th .hill{position:absolute;left:-12px;right:-12px;bottom:-26px;height:56px;border-radius:50% 50% 0 0;background:rgba(20,16,14,.5)}
.edits .win .prev{left:236px;width:388px;background:#0d0d10}
.edits .win .frm{position:absolute;left:50%;top:14px;width:162px;height:290px;margin-left:-81px;border-radius:16px;overflow:hidden;
  background:linear-gradient(172deg,#4a3420 0%,#1c1511 62%,#14100E 100%);border:2px solid rgba(255,255,255,.2);box-shadow:0 14px 30px rgba(0,0,0,.6)}
.edits .win .frm i{position:absolute;display:block}
.edits .win .frm .fc{left:14px;right:14px;top:18px;height:84px;border-radius:12px;background:linear-gradient(150deg,#F5DDA2,#C9A05A)}
.edits .win .frm .c1{left:16px;right:16px;top:134px;height:17px;border-radius:9px;background:#FBF3E4}
.edits .win .frm .c2{left:36px;right:36px;top:160px;height:17px;border-radius:9px;background:#FBF3E4}
.edits .win .frm .fw{left:50%;bottom:16px;width:66px;height:66px;margin-left:-33px;border-radius:50%;border:4px solid #E3C07B;background:#2b2019;overflow:hidden}
.edits .win .frm .fw::before{content:"";position:absolute;left:50%;top:10px;width:24px;height:24px;margin-left:-12px;border-radius:50%;background:#E3C07B}
.edits .win .frm .fw::after{content:"";position:absolute;left:50%;top:38px;width:46px;height:40px;margin-left:-23px;border-radius:50% 50% 0 0;background:#E3C07B}
.edits .win .insp{left:624px;width:236px;border-left:2px solid rgba(0,0,0,.5)}
.edits .win .sl{position:absolute;left:20px;right:20px;height:44px}
.edits .win .sl b{position:absolute;left:0;top:0;width:104px;height:11px;border-radius:6px;background:rgba(255,255,255,.3)}
.edits .win .sl u{position:absolute;left:0;right:0;top:26px;height:5px;border-radius:3px;background:rgba(255,255,255,.14);text-decoration:none}
.edits .win .sl u::before{content:"";position:absolute;left:0;top:0;bottom:0;width:var(--v);border-radius:3px;background:#E3C07B}
.edits .win .sl u::after{content:"";position:absolute;left:var(--v);top:-7px;width:19px;height:19px;margin-left:-9px;border-radius:50%;background:#FBF3E4;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.edits .win .tl{position:absolute;left:0;right:0;top:390px;bottom:0;background:#121214;border-top:2px solid rgba(255,255,255,.08)}
.edits .win .tl .tb{position:absolute;left:16px;top:8px;display:flex;gap:14px}
.edits .win .tl .tb i{display:block;width:22px;height:22px;border-radius:7px;background:rgba(255,255,255,.3)}
.edits .win .tl .zm{position:absolute;right:20px;top:18px;width:120px;height:4px;border-radius:2px;background:rgba(255,255,255,.2)}
.edits .win .tl .zm::after{content:"";position:absolute;left:62%;top:-7px;width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.55)}
.edits .win .tl .rl{position:absolute;left:60px;right:0;top:38px;height:18px;border-bottom:2px solid rgba(255,255,255,.1);
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.3) 0 2px,transparent 2px 40px) left bottom/100% 9px no-repeat}
.edits .win .tl .lane{position:absolute;left:60px;right:0;height:26px}
.edits .win .tl .gi{position:absolute;left:18px;width:24px;height:20px;border-radius:7px;background:rgba(255,255,255,.18)}
.edits .win .tl .cl{position:absolute;top:0;height:26px;border-radius:8px;overflow:hidden}
.edits .win .tl .cl.tx{background:linear-gradient(180deg,#F0D49A,#D3A85F)}
.edits .win .tl .cl.tx::after{content:"";position:absolute;left:12px;right:46%;top:10px;height:6px;border-radius:3px;background:rgba(42,33,28,.55)}
.edits .win .tl .cl.vd::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(0,0,0,.34) 0 2px,transparent 2px 46px)}
.edits .win .tl .au{position:absolute;left:0;right:0;top:0;height:26px;border-radius:8px;background:rgba(227,192,123,.14)}
.edits .win .tl .au svg{position:absolute;left:0;top:0;width:100%;height:26px}
.edits .win .tl .ph{position:absolute;left:432px;top:36px;bottom:0;width:4px;margin-left:-2px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.4)}
.edits .win .tl .ph::before{content:"";position:absolute;left:50%;top:-4px;width:20px;height:22px;margin-left:-10px;border-radius:6px 6px 10px 10px;background:#fff}
.edits .no{position:absolute;left:0;top:0;width:1080px;height:1350px;pointer-events:none;filter:drop-shadow(0 16px 22px rgba(0,0,0,.55))}
.edits .bubble{position:absolute;left:80px;top:940px;width:860px;padding:44px 54px 50px;border-radius:60px 60px 60px 18px;
  background:linear-gradient(160deg,#F5DDA2 0%,#E3C07B 55%,#D3A85F 100%);color:#2A211C;
  font-weight:800;font-size:60px;line-height:1.14;letter-spacing:-.01em;
  box-shadow:0 34px 60px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.55)}
.edits .bubble .tail{position:absolute;right:92px;bottom:-40px;width:64px;height:60px;
  background:#D3A85F;clip-path:polygon(0 0,100% 0,18% 100%)}

/* warm-cases / training: строки со стеклом */
.train .row{left:80px;width:920px;height:198px;display:flex;align-items:center;gap:34px;padding:0 44px 0 34px}
.train .row .ic{width:144px;height:144px;flex:none;display:flex;align-items:center;justify-content:center}
.train .row .ic img{max-width:144px;max-height:144px;display:block;filter:drop-shadow(0 12px 14px rgba(0,0,0,.45))}
.train .row .ic.wide{width:190px;height:150px}
.train .row .ic.wide img{max-width:none;max-height:none}
.light.train .row .ic img{filter:drop-shadow(0 8px 10px rgba(70,40,15,.3))}
.train .row .ic.strip{overflow:hidden}
.train .row .ic.strip img{filter:none}
.train .row .t{font-weight:700;font-size:42px;line-height:1.18;color:var(--cream)}
.train .row.bonus{border-color:var(--gold);background:linear-gradient(145deg,rgba(227,192,123,.24),rgba(227,192,123,.07))}
.train .row .t small{display:block;margin-top:8px;font-weight:800;font-size:30px;letter-spacing:.04em;color:var(--gold)}
.light .train .row .t,.light.train .row .t{color:#2A211C}
.light.train .row .t small{color:#8F5E1E}

/* topic (большая цифра) */
.topic .digit{position:absolute;left:62px;top:326px;font-family:'Unbounded',sans-serif;font-weight:700;font-size:760px;line-height:1;letter-spacing:-.04em;
  background:linear-gradient(180deg,#F0D49A 0%,#E3C07B 40%,rgba(160,83,42,.75) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 20px 40px rgba(0,0,0,.35));opacity:.96}

/* live: плашка LIVE с красной точкой */
.live .onair{left:80px;height:164px;display:flex;align-items:center;gap:32px;padding:0 60px 0 48px;border-radius:999px;
  font-family:'Unbounded',sans-serif;font-weight:700;font-size:98px;line-height:1;letter-spacing:.02em;color:var(--cream);white-space:nowrap}
.live .onair .dot{display:block;flex:none;width:68px;height:68px;border-radius:50%;
  background:radial-gradient(circle at 36% 30%,#FF8A6B 0%,#E5472C 52%,#B02A18 100%);
  box-shadow:0 0 0 13px rgba(229,71,44,.22),0 0 0 28px rgba(229,71,44,.09),0 0 60px rgba(255,98,64,.6)}
.light .live .onair,.light.live .onair{background:linear-gradient(145deg,#2d231d,#17110e);border-color:rgba(227,192,123,.7);box-shadow:0 26px 54px rgba(60,35,15,.4)}

/* live-now: фото со сцены на всю карточку */
.stage .photo{position:absolute;left:-440px;top:0;width:2025px;height:1350px;background:url("obj/alex-stage-mic.webp") 0 0/100% 100% no-repeat;filter:sepia(.28) saturate(.92) contrast(1.06)}
.stage .shade{position:absolute;inset:0;background:
  linear-gradient(90deg,rgba(20,16,14,.97) 0%,rgba(20,16,14,.88) 44%,rgba(20,16,14,.3) 62%,transparent 82%),
  linear-gradient(0deg,#14100E 0%,rgba(20,16,14,.9) 13%,rgba(20,16,14,0) 44%),
  linear-gradient(180deg,rgba(20,16,14,.6) 0%,transparent 24%),
  radial-gradient(720px 620px at 76% 24%,rgba(227,192,123,.14),transparent 70%)}
.live .onair.sm{height:128px;gap:24px;padding:0 44px 0 36px;font-size:76px}
.live .onair.sm .dot{width:52px;height:52px;box-shadow:0 0 0 10px rgba(229,71,44,.22),0 0 0 22px rgba(229,71,44,.09),0 0 48px rgba(255,98,64,.6)}

/* offer */
.offer .badge{position:absolute;left:80px;top:150px;width:360px;height:156px;border-radius:40px;transform:rotate(-4deg);display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#F5DDA2 0%,#E3C07B 55%,#C9A05A 100%);box-shadow:0 26px 50px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.55);
  font-family:'Unbounded',sans-serif;font-weight:700;font-size:92px;letter-spacing:-.03em;color:#2A211C;white-space:nowrap}
.offer .old{position:absolute;left:490px;top:206px;font-family:'Unbounded',sans-serif;font-weight:600;font-size:60px;line-height:1;color:rgba(251,243,228,.6);letter-spacing:-.01em;white-space:nowrap}
.offer .old::after{content:"";position:absolute;left:-14px;right:-14px;top:50%;height:6px;border-radius:3px;background:#C0562A;transform:rotate(-4deg);box-shadow:0 2px 10px rgba(0,0,0,.4)}
.offer .price{position:absolute;left:74px;top:346px;font-family:'Unbounded',sans-serif;font-weight:700;font-size:140px;line-height:1.05;letter-spacing:-.035em;white-space:nowrap;
  background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 10px 34px rgba(227,192,123,.28))}
.offer .inst{position:absolute;left:80px;top:512px;width:620px;font-weight:600;font-size:42px;line-height:1.3;color:rgba(251,243,228,.9)}
.offer .until{position:absolute;left:80px;top:648px;display:inline-flex;align-items:center;gap:18px;height:92px;padding:0 42px;border-radius:999px;
  border:2px solid var(--gold);background:linear-gradient(135deg,rgba(227,192,123,.22),rgba(227,192,123,.06));font-weight:800;font-size:40px;color:var(--cream);box-shadow:0 14px 40px rgba(0,0,0,.35)}
.offer .until b{display:block;width:16px;height:16px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 7px rgba(227,192,123,.2)}
.offer .gift{left:80px;top:776px;width:392px;padding:26px 28px 26px;border-radius:30px}
.offer .gift .k{font-weight:800;font-size:28px;letter-spacing:.14em;color:var(--gold)}
.offer .gift .t{margin-top:10px;font-weight:700;font-size:32px;line-height:1.22;color:var(--cream);white-space:nowrap}
.offer .gift .k+.t{margin-top:14px}
.offer .gift .t+.t{margin-top:12px;padding-top:12px;border-top:1px solid rgba(227,192,123,.28)}

/* reg-bonus, bonus-got: обложки PDF бонусов */
.paper{position:absolute;overflow:hidden;border-radius:30px;border:3px solid rgba(227,192,123,.9);box-shadow:0 34px 50px rgba(0,0,0,.55),0 0 70px rgba(227,192,123,.16)}
.paper img{display:block;width:100%;height:100%;object-fit:cover}
.paper .pdf{position:absolute;right:18px;top:18px;height:46px;padding:0 18px;display:flex;align-items:center;border-radius:12px;background:#2A211C;color:var(--gold);font-weight:800;font-size:27px;letter-spacing:.1em}
.paper.sm{border-radius:22px;border-width:2px}

/* t-minus-30, again-today: крупное время */
.clock{position:absolute;font-family:'Unbounded',sans-serif;font-weight:700;line-height:1;letter-spacing:-.04em;white-space:nowrap}

/* vaib: гигантское слово */
.vaib .word{position:absolute;left:62px;top:300px;font-family:'Unbounded',sans-serif;font-weight:700;font-size:268px;line-height:1;letter-spacing:-.04em;white-space:nowrap}

/* training: строка с фактами курса под заголовком */
.facts{position:absolute;left:80px;top:372px;height:78px;display:flex;align-items:center;gap:18px;font-weight:700;font-size:38px;color:#2A211C;white-space:nowrap}
.facts b{font-family:'Unbounded',sans-serif;font-weight:700;font-size:44px;background:linear-gradient(180deg,#C99236,#8F5E1E);-webkit-background-clip:text;background-clip:text;color:transparent;margin-right:-6px}
.facts i{display:block;width:8px;height:8px;border-radius:50%;background:#A8741F;margin:0 8px}

/* installment */
.inst-card .pill{position:absolute;left:80px;top:470px;height:92px;padding:0 40px;display:flex;align-items:center;border-radius:999px;
  background:linear-gradient(160deg,#F5DDA2 0%,#E3C07B 60%,#D3A85F 100%);color:#2A211C;font-weight:800;font-size:42px;box-shadow:0 18px 36px rgba(120,80,30,.3)}

/* topic-p1: подпись справа от цифры 7 */
.steps{position:absolute;left:640px;top:470px;font-weight:700;font-size:44px;line-height:1.26;color:var(--cream)}

/* bonus-got: четыре обложки веером */
.fan{position:absolute;left:0;top:0;width:1080px;height:1350px}
.fan .paper{left:300px;top:540px;width:480px;height:480px;border-radius:26px;border-width:3px;transform-origin:50% 190%}
.fan .paper .pdf{display:none}

/* again-today: билет с печатью «Повтор» */
.ticket{position:absolute;left:70px;top:408px;width:940px;height:340px;transform:rotate(-3deg);border-radius:30px;
  background:linear-gradient(135deg,#FBF3E4 0%,#F2E0BA 100%);box-shadow:0 36px 56px rgba(0,0,0,.55);
  -webkit-mask:radial-gradient(circle 30px at 0 50%,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 30px at 100% 50%,#0000 97%,#000) right/51% 100% no-repeat}
.ticket .tk-time{position:absolute;left:54px;top:56px;font-family:'Unbounded',sans-serif;font-weight:700;font-size:158px;line-height:1;letter-spacing:-.04em;
  background:linear-gradient(180deg,#C99236 0%,#A8741F 55%,#7E4F17 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding:.12em .04em .02em;margin:-.12em -.04em -.02em}
.ticket .tk-sub{position:absolute;left:54px;bottom:34px;font-weight:800;font-size:40px;line-height:1.2;color:#2A211C}
.ticket .tk-cut{position:absolute;left:690px;top:34px;bottom:34px;border-left:4px dashed rgba(42,33,28,.28)}
.ticket .tk-stamp{position:absolute;left:712px;top:50px;padding:8px 18px;border:6px solid #A0532A;border-radius:14px;transform:rotate(-8deg);

function stand(key, o) {
  const [w, h, l, t, r, b] = BB[key];
  const iw = o.vw / (r - l), ih = iw * h / w;
  const left = o.cx - ((l + r) / 2) * iw, top = o.foot - b * ih;

  return shadow + `<img class="obj" src="${srcOf(key)}" style="left:${left}px;top:${top}px;width:${iw}px;${o.css || ""}" alt="">`;

      ${lane(154, `<div class="au"><svg viewBox="0 0 800 26" preserveAspectRatio="none">${bars}</svg></div>`)}
