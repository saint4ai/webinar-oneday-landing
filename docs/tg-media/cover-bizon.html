<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<title>Обложка эфира Bizon 1920x1080</title>
<link rel="stylesheet" href="base.css">
<style>
html,body{width:1920px;height:1080px}
.stage{position:relative;width:1920px;height:1080px;overflow:hidden;
  background:
    radial-gradient(900px 760px at 1440px 430px,rgba(227,192,123,.34),rgba(227,192,123,.10) 48%,transparent 72%),
    radial-gradient(760px 620px at 120px 1040px,rgba(160,83,42,.26),transparent 70%),
    radial-gradient(1200px 900px at 18% 8%,#2a211b 0%,transparent 70%),
    linear-gradient(115deg,#14100E 0%,#1a1411 55%,#211A16 100%)}
/* ореол и луч за Александром */
.ring{position:absolute;left:1060px;top:20px;width:820px;height:820px;border-radius:50%;
  border:1.5px solid rgba(227,192,123,.22);box-shadow:0 0 120px rgba(227,192,123,.10) inset}
.ring.r2{left:1140px;top:100px;width:660px;height:660px;border-color:rgba(227,192,123,.12)}
.beam{position:absolute;left:1180px;top:-200px;width:520px;height:1500px;transform:rotate(18deg);
  background:linear-gradient(90deg,transparent,rgba(255,228,170,.07) 50%,transparent)}
.alex{position:absolute;left:1048px;top:-11px;height:1180px;width:auto;
  filter:drop-shadow(0 0 1.2px rgba(255,226,165,.95)) drop-shadow(0 0 26px rgba(227,192,123,.30)) drop-shadow(-18px 24px 36px rgba(0,0,0,.5))}
.floor{position:absolute;left:0;right:0;bottom:0;height:300px;
  background:linear-gradient(0deg,rgba(20,16,14,.78),transparent)}
.leftfade{position:absolute;left:0;top:0;bottom:0;width:1120px;
  background:linear-gradient(90deg,rgba(20,16,14,.55) 0%,rgba(20,16,14,.35) 60%,transparent 100%)}

/* текст: только левые 55% */
.copy{position:absolute;left:96px;top:84px;bottom:80px;width:960px;display:flex;flex-direction:column;justify-content:space-between}
.kicker{font-weight:700;font-size:27px;letter-spacing:.15em;color:var(--gold);text-transform:uppercase;white-space:nowrap}
.kicker i{display:inline-block;width:46px;height:2px;background:var(--gold);vertical-align:middle;margin-right:18px;transform:translateY(-3px)}
h1{font-family:'Unbounded',sans-serif;font-weight:700;font-size:76px;line-height:1.1;letter-spacing:-.015em;color:var(--cream);white-space:nowrap}
h1 span{display:block;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-weight:500;font-size:35px;line-height:1.38;color:rgba(251,243,228,.82);margin-top:34px;max-width:900px}
.pill{display:inline-flex;align-items:center;gap:18px;margin-top:46px;padding:0 40px;height:84px;border-radius:999px;
  background:linear-gradient(135deg,#F0D49A 0%,#E3C07B 40%,#C9A05A 100%);color:#14100E;
  font-weight:800;font-size:31px;letter-spacing:.07em;box-shadow:0 14px 40px rgba(201,160,90,.35),inset 0 1px 0 rgba(255,255,255,.5)}
.pill b{display:block;width:17px;height:17px;border-radius:50%;background:#A0532A;box-shadow:0 0 0 6px rgba(160,83,42,.25)}
.logo{height:56px;width:auto;display:block;align-self:flex-start}

/* стеклянные карточки вокруг Александра */
.c-reel{left:1636px;top:112px;width:236px;height:420px;padding:9px;border-radius:30px;transform:rotate(5deg)}
.c-reel .in{position:relative;width:100%;height:100%;border-radius:22px;overflow:hidden;background:#000}
.c-reel img{width:100%;height:100%;object-fit:cover;display:block}
.c-reel .views{position:absolute;left:10px;bottom:10px;display:flex;align-items:center;gap:8px;padding:0 15px 0 12px;height:42px;border-radius:999px;
  background:rgba(20,16,14,.72);border:1px solid rgba(227,192,123,.5);backdrop-filter:blur(8px);font-weight:800;font-size:22px;color:var(--cream)}
.c-reel .views svg{width:22px;height:22px;flex:none}
.c-step{display:flex;align-items:center;gap:18px;height:176px;padding:0 26px 0 18px;border-radius:28px}
.c-step img{flex:none;width:118px;height:auto;max-height:140px;object-fit:contain;filter:drop-shadow(0 12px 14px rgba(0,0,0,.45))}
.c-step b{display:block;font-weight:800;font-size:34px;line-height:1.1;color:var(--cream);white-space:nowrap}
.c-step span{display:block;font-weight:600;font-size:25px;line-height:1.2;color:rgba(251,243,228,.78);margin-top:6px;white-space:nowrap}
.c-a{left:1074px;top:800px;width:350px;transform:rotate(-4deg)}
.c-b{left:1560px;top:806px;width:340px;transform:rotate(3deg)}
</style></head>
<body>
<div class="stage" id="stage">
  <div class="beam"></div>
  <div class="ring"></div><div class="ring r2"></div>
  <img class="alex" src="../../workshop-montazh/assets/img/alex.png" alt="">
  <div class="floor"></div>
  <div class="leftfade"></div>

  <div class="glass c-reel"><div class="in">
    <img src="../../workshop-montazh/assets/tg/reel-119k.jpg" alt="">
    <div class="views"><svg viewBox="0 0 24 24" fill="none" stroke="#E3C07B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 12S5.5 4.5 12 4.5 22.5 12 22.5 12 18.5 19.5 12 19.5 1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3.2"/></svg>119 тыс.</div>
  </div></div>
  <div class="glass c-step c-a"><img src="obj/lg-i-clapper-x3.png" alt=""><div><b>Монтаж</b><span>делает агент</span></div></div>
  <div class="glass c-step c-b"><img src="obj/lg-i-botchat-x3.png" alt=""><div><b>Заявка</b><span>в Telegram</span></div></div>

  <div class="copy">
    <div class="kicker"><i></i>Бесплатный воркшоп · Вайб-продакшен</div>
    <div>
      <h1>Рилсы без<br>монтажёра<span>и без лица</span></h1>
      <p class="sub">Покажу весь путь: агент пишет сценарий, монтирует и отвечает клиентам в директе.</p>
      <div class="pill"><b></b>СТАРТ В 20:00 ПО АЛМАТЫ</div>
    </div>
    <img class="logo" src="onai-logo-night.svg" alt="onAI">
  </div>
  <div class="grain"></div>
</div>
</body></html>
